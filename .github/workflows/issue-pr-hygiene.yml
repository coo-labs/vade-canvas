name: Issue / PR hygiene

# Thin trigger: fires on PR/issue events and delegates to the canonical
# reusable workflow at coo-labs/coo-harness/.github/workflows/issue-pr-hygiene-reusable.yml.
#
# Centralization: coo-labs/coo-memory#939 (F7), absorbs coo-labs/coo-memory#767.
# Per-repo behavior is one input: `pattern-b-mode`.
#
# vade-canvas starts on `advisory`. Promotion to `blocking` is governed by
# the coo/adoption_tracker.md betterment cadence (≥14 days clean) in vcm —
# change the `pattern-b-mode` value below when ready.

on:
  pull_request:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited, labeled]

permissions:
  pull-requests: write
  issues: write
  contents: read
  checks: write

jobs:
  hygiene:
    uses: coo-labs/coo-harness/.github/workflows/issue-pr-hygiene-reusable.yml@main
    with:
      pattern-b-mode: advisory
    secrets: inherit
